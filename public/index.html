<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat Games Manager</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="auth-loading" class="min-h-screen flex items-center justify-center text-gray-500">Carregando...</div>

    <div id="auth-view" class="hidden min-h-screen flex items-center justify-center p-4">
      <div class="panel w-full max-w-sm">
        <div class="flex items-center gap-2 mb-6">
          <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">B</span>
          <span class="font-semibold text-lg">Beat Games</span>
        </div>

        <h2 id="auth-title" class="panel-title">Entrar</h2>

        <button type="button" id="google-login-btn" class="btn-secondary w-full mb-4">Entrar com Google</button>

        <div class="flex items-center gap-2 mb-4 text-sm text-gray-400">
          <span class="flex-1 border-t border-gray-200"></span>
          ou
          <span class="flex-1 border-t border-gray-200"></span>
        </div>

        <form id="auth-form">
          <div class="field">
            <label for="auth-email">E-mail</label>
            <input id="auth-email" type="email" required autocomplete="email" class="input-field" />
          </div>

          <div class="field">
            <label for="auth-password">Senha</label>
            <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" class="input-field" />
          </div>

          <p id="auth-error" class="hidden text-sm text-red-600 mb-3"></p>

          <button type="submit" id="auth-submit" class="btn-primary w-full">Entrar</button>
        </form>

        <div class="flex justify-between mt-4 text-sm">
          <button type="button" id="auth-toggle-mode" class="text-blue-600 hover:underline">Criar conta</button>
          <button type="button" id="auth-reset-password" class="text-gray-500 hover:underline">Esqueci a senha</button>
        </div>
      </div>
    </div>

    <div id="app-view" class="hidden min-h-screen">
      <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-30 md:hidden"></div>

      <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 fixed inset-y-0 left-0 z-40 flex flex-col p-4 -translate-x-full md:translate-x-0 transition-transform">
        <div class="flex items-center gap-2 px-2 py-3">
          <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">B</span>
          <span class="font-semibold text-lg">Beat Games</span>
        </div>

        <nav class="mt-6 flex flex-col gap-1" aria-label="Menu principal">
          <button type="button" class="sidebar-link" data-view="dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5" /><rect x="14" y="3" width="7" height="5" rx="1.5" /><rect x="14" y="12" width="7" height="9" rx="1.5" /><rect x="3" y="16" width="7" height="5" rx="1.5" /></svg>
            Dashboard
          </button>
          <button type="button" class="sidebar-link" data-view="games">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="3" /><path d="M7 10v4M5 12h4M15.5 11.5h.01M18 13h.01" stroke-linecap="round" /></svg>
            Jogos
          </button>

          <p class="mt-4 mb-1 px-3 text-xs font-semibold uppercase tracking-wide text-gray-400">Cadastros</p>

          <button type="button" class="sidebar-link" data-view="statuses">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" /><path d="M8 12l3 3 5-6" stroke-linecap="round" stroke-linejoin="round" /></svg>
            Status
          </button>
          <button type="button" class="sidebar-link" data-view="platforms">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" stroke-linecap="round" /></svg>
            Plataformas
          </button>
          <button type="button" class="sidebar-link" data-view="genres">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z" stroke-linejoin="round" /><path d="M7.5 7.5h.01" stroke-linecap="round" /></svg>
            Gêneros
          </button>
          <button type="button" class="sidebar-link" data-view="types">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6" stroke-linecap="round" /></svg>
            Tipos
          </button>
          <button type="button" class="sidebar-link" data-view="scores">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.7 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.7 7.1.6-5.4 4.7 1.6 7z" stroke-linejoin="round" /></svg>
            Notas / Avaliações
          </button>
          <button type="button" class="sidebar-link" data-view="difficulties">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V14M10 20V9M16 20V4M22 20H2" stroke-linecap="round" /></svg>
            Níveis de Dificuldade
          </button>
        </nav>

        <div class="mt-auto border-t border-gray-200 pt-4 px-2">
          <p id="user-email" class="text-sm text-gray-500 truncate mb-2"></p>
          <button type="button" id="logout-btn" class="btn-secondary w-full text-sm">Sair</button>
        </div>
      </aside>

      <div class="md:ml-64">
        <header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-4 flex items-center gap-3">
          <button type="button" id="menu-btn" class="md:hidden icon-btn" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" /></svg>
          </button>
          <div>
            <h1 id="page-title" class="text-lg font-semibold">Dashboard</h1>
            <p id="page-subtitle" class="text-sm text-gray-500"></p>
          </div>
        </header>

        <main class="p-4 sm:p-6">
          <p id="load-error" class="hidden panel mb-4 text-sm text-red-600" role="alert"></p>
          <section id="view-dashboard" data-view-panel="dashboard"></section>
          <section id="view-games" data-view-panel="games" class="hidden"></section>
          <section id="view-statuses" data-view-panel="statuses" class="hidden"></section>
          <section id="view-platforms" data-view-panel="platforms" class="hidden"></section>
          <section id="view-genres" data-view-panel="genres" class="hidden"></section>
          <section id="view-types" data-view-panel="types" class="hidden"></section>
          <section id="view-scores" data-view-panel="scores" class="hidden"></section>
          <section id="view-difficulties" data-view-panel="difficulties" class="hidden"></section>
        </main>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
