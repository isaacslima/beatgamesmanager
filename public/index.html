<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat Games Manager</title>
    <script>
      // Aplica o tema antes de desenhar a página (evita "piscar" claro → escuro).
      try {
        const saved = localStorage.getItem('color-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="auth-loading" class="flex min-h-screen items-center justify-center text-gray-500 dark:text-gray-400">Carregando...</div>

    <!-- Login (baseado na tela de login do Flowbite Admin Dashboard) -->
    <div id="auth-view" class="hidden">
      <div class="mx-auto flex min-h-screen flex-col items-center justify-center px-6 py-8">
        <span class="mb-8 flex items-center justify-center gap-3 text-2xl font-semibold text-gray-900 lg:mb-10 dark:text-white">
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary-600 text-lg font-bold text-white">B</span>
          Beat Games
        </span>
        <div class="w-full max-w-md space-y-6 rounded-lg bg-white p-6 shadow-sm sm:p-8 dark:bg-gray-800">
          <div>
            <h2 id="auth-title" class="text-2xl font-bold text-gray-900 dark:text-white">Entrar na sua biblioteca</h2>
            <p class="muted mt-1">Gerencie os jogos que você quer zerar.</p>
          </div>

          <button type="button" id="google-login-btn" class="btn-secondary w-full">
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
            Entrar com Google
          </button>

          <div class="flex items-center gap-3 text-sm text-gray-400">
            <span class="flex-1 border-t border-gray-200 dark:border-gray-700"></span>
            ou
            <span class="flex-1 border-t border-gray-200 dark:border-gray-700"></span>
          </div>

          <form id="auth-form" class="space-y-6">
            <div>
              <label for="auth-email" class="field-label">E-mail</label>
              <input id="auth-email" type="email" required autocomplete="email" class="input-field" placeholder="voce@email.com" />
            </div>
            <div>
              <label for="auth-password" class="field-label">Senha</label>
              <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" class="input-field" placeholder="••••••••" />
            </div>

            <p id="auth-error" class="form-error hidden" role="alert"></p>

            <button type="submit" id="auth-submit" class="btn-primary w-full">Entrar</button>

            <div class="flex items-center justify-between text-sm">
              <button type="button" id="auth-toggle-mode" class="font-medium text-primary-700 hover:underline dark:text-primary-500">Criar conta</button>
              <button type="button" id="auth-reset-password" class="text-gray-500 hover:underline dark:text-gray-400">Esqueci a senha</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- App -->
    <div id="app-view" class="hidden">
      <nav class="fixed z-30 w-full border-b border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
        <div class="px-3 py-3 lg:px-5 lg:pl-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <button type="button" id="menu-btn" class="icon-btn lg:hidden" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
                <span data-icon="menu" data-icon-class="h-6 w-6"></span>
              </button>
              <a href="#dashboard" class="ml-2 flex items-center gap-3 md:mr-24">
                <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-600 font-bold text-white">B</span>
                <span class="self-center text-xl font-semibold whitespace-nowrap sm:text-2xl dark:text-white">Beat Games</span>
              </a>
            </div>

            <div class="flex items-center gap-2">
              <button type="button" id="theme-toggle" class="icon-btn" aria-label="Alternar modo escuro">
                <span id="theme-icon-dark" data-icon="moon" data-icon-class="h-5 w-5"></span>
                <span id="theme-icon-light" class="hidden" data-icon="sun" data-icon-class="h-5 w-5"></span>
              </button>

              <div class="relative">
                <button type="button" id="user-menu-button" class="flex rounded-full text-sm focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600" aria-expanded="false" aria-haspopup="menu" aria-controls="user-menu">
                  <span class="sr-only">Abrir menu do usuário</span>
                  <img id="user-avatar" class="hidden h-8 w-8 rounded-full" alt="" referrerpolicy="no-referrer" />
                  <span id="user-initial" class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-600 text-sm font-semibold text-white">?</span>
                </button>
                <div id="user-menu" class="absolute right-0 z-50 mt-2 hidden w-60 divide-y divide-gray-100 rounded-lg bg-white text-base shadow-lg dark:divide-gray-600 dark:bg-gray-700" role="menu" aria-labelledby="user-menu-button">
                  <div class="px-4 py-3">
                    <p id="user-name" class="text-sm text-gray-900 dark:text-white"></p>
                    <p id="user-email" class="truncate text-sm font-medium text-gray-900 dark:text-gray-300"></p>
                  </div>
                  <ul class="py-1">
                    <li>
                      <button type="button" id="logout-btn" class="flex w-full items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white" role="menuitem">
                        <span data-icon="log-out"></span> Sair
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <div class="flex overflow-hidden bg-gray-50 pt-16 dark:bg-gray-900">
        <aside id="sidebar" class="fixed top-0 left-0 z-20 flex h-full w-64 shrink-0 -translate-x-full flex-col border-r border-gray-200 bg-white pt-16 transition-transform duration-200 lg:translate-x-0 dark:border-gray-700 dark:bg-gray-800" aria-label="Menu lateral">
          <div class="flex-1 overflow-y-auto px-3 py-4">
            <ul class="space-y-2 pb-2">
              <li>
                <button type="button" class="sidebar-link" data-view="dashboard"><span data-icon="layout-dashboard"></span><span>Dashboard</span></button>
              </li>
              <li>
                <button type="button" class="sidebar-link" data-view="games"><span data-icon="gamepad-2"></span><span>Jogos</span></button>
              </li>
              <li>
                <button type="button" id="catalog-toggle" class="sidebar-link" aria-controls="catalog-menu" aria-expanded="true">
                  <span data-icon="list"></span>
                  <span class="flex-1 text-left whitespace-nowrap">Cadastros</span>
                  <span data-icon="chevron-down" data-icon-class="h-5 w-5 transition-transform" id="catalog-chevron"></span>
                </button>
                <ul id="catalog-menu" class="space-y-2 py-2">
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="statuses">Status</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="tags">Tags</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="platforms">Plataformas</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="genres">Gêneros</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="types">Tipos</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="scores">Notas / Avaliações</button></li>
                  <li><button type="button" class="sidebar-link sidebar-sublink" data-view="difficulties">Níveis de Dificuldade</button></li>
                </ul>
              </li>
            </ul>
          </div>
        </aside>

        <div id="sidebar-backdrop" class="fixed inset-0 z-10 hidden bg-gray-900/50 lg:hidden dark:bg-gray-900/90"></div>

        <div class="relative min-h-[calc(100vh-4rem)] w-full overflow-x-hidden lg:ml-64">
          <main class="px-4 pt-6 pb-10">
            <div class="mb-5">
              <nav class="mb-3 flex" aria-label="Breadcrumb">
                <ol id="breadcrumb" class="inline-flex flex-wrap items-center gap-1 text-sm font-medium text-gray-700 md:gap-2 dark:text-gray-400"></ol>
              </nav>
              <h1 id="page-title" class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Dashboard</h1>
              <p id="page-subtitle" class="muted mt-1"></p>
            </div>

            <p id="load-error" class="form-error hidden" role="alert"></p>

            <section id="view-dashboard" data-view-panel="dashboard"></section>
            <section id="view-games" data-view-panel="games" class="hidden"></section>
            <section id="view-statuses" data-view-panel="statuses" class="hidden"></section>
            <section id="view-tags" data-view-panel="tags" class="hidden"></section>
            <section id="view-platforms" data-view-panel="platforms" class="hidden"></section>
            <section id="view-genres" data-view-panel="genres" class="hidden"></section>
            <section id="view-types" data-view-panel="types" class="hidden"></section>
            <section id="view-scores" data-view-panel="scores" class="hidden"></section>
            <section id="view-difficulties" data-view-panel="difficulties" class="hidden"></section>
          </main>
        </div>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
